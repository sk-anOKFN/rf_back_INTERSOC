services:

  postgres:
    build:
      context: ./postgres
      dockerfile: dockerfile
    container_name: incident_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Published only for admin tools; bound to localhost by default. Containers always use 5432.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - log_network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: detector-ollama
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: ${NUM_WORKERS:-1}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # Published only for debugging; bound to localhost by default. Containers always use 11434.
      - "${OLLAMA_BIND:-127.0.0.1}:${OLLAMA_PUBLISH_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Start Ollama server in background
        ollama serve &

        # Wait for server to be ready
        sleep 5

        # Pull model if not already present
        ollama pull ${OLLAMA_MODEL:-llama3.2:latest}

        # Keep container running
        wait
    networks:
      - log_network
    restart: unless-stopped

  log_detector:
    build:
      context: ./log_detector
      dockerfile: dockerfile
    container_name: log_detector
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      OLLAMA_HOST: ${OLLAMA_HOST:-detector-ollama}
      OLLAMA_PORT: 11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-60}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.1}
      OLLAMA_FORMAT: ${OLLAMA_FORMAT:-schema}
      DETECTION_THRESHOLD: ${DETECTION_THRESHOLD:-0.85}
      REQUIRE_INDICATOR_FOR_ANOMALY: ${REQUIRE_INDICATOR_FOR_ANOMALY:-true}
      PROMPT_EXAMPLES: ${PROMPT_EXAMPLES:-false}
      NUM_WORKERS: ${NUM_WORKERS:-1}
      RATE_LIMIT_DELAY: ${RATE_LIMIT_DELAY:-0}
      INDEXER_URL: ${INDEXER_URL:-}
      INDEXER_USER: ${INDEXER_USER:-}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:-}
      INDEXER_INDEX: ${INDEXER_INDEX:-wazuh-alerts-4.x-*}
      INDEXER_VERIFY_TLS: ${INDEXER_VERIFY_TLS:-true}
      INDEXER_CA_CERT: ${INDEXER_CA_CERT:-}
      INDEXER_POLL_INTERVAL: ${INDEXER_POLL_INTERVAL:-10}
      INDEXER_PAGE_SIZE: ${INDEXER_PAGE_SIZE:-200}
      INDEXER_LOOKBACK_MIN: ${INDEXER_LOOKBACK_MIN:-5}
      INDEXER_SETTLE_SEC: ${INDEXER_SETTLE_SEC:-30}
      MIN_RULE_LEVEL: ${MIN_RULE_LEVEL:-0}
      RULE_ID_ALLOWLIST: ${RULE_ID_ALLOWLIST:-}
      RULE_ID_DENYLIST: ${RULE_ID_DENYLIST:-}
    volumes:
      # Indexer CA certificate. In Portainer Git stacks use an absolute host path (see README).
      - ${INDEXER_CERTS_DIR:-./certs}:/certs:ro
    extra_hosts:
      # Lets INDEXER_URL point at the Docker host, e.g. an SSH tunnel or a local Wazuh.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - log_network
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: dockerfile
    container_name: db-api
    environment:
      API_PORT: ${API_PORT:-8000}
      API_HOST: ${API_HOST:-0.0.0.0}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-100000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      # Must be reachable from users' browsers: the dashboard calls the API directly.
      - "${API_PUBLISH_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - log_network
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:

networks:
  log_network:
    external: true
    name: log_ad_network
